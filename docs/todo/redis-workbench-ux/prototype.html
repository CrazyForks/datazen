<!doctype html>
<html lang="zh" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataZen · Redis 工作区 UI/UX 原型 · REDIS_WORKSPACE_UX</title>
    <style>
      /* Tokens copied from src/styles/themes.css (light = :root, dark = .dark)
   so the prototype stays faithful to the real host palette. */
      :root {
        --c-surface: #f6f8fb;
        --c-surface-alt: #f1f5f9;
        --c-surface-raised: #e8eef6;
        --c-surface-inset: #ffffff;
        --c-edge: #e1e8f1;
        --c-edge-hi: #c6d2e1;
        --c-fg: #26364d;
        --c-fg-secondary: #58708d;
        --c-fg-muted: #8498af;
        --c-accent: #2f9fd4;
        --c-accent-dim: rgba(79, 195, 247, 0.14);
        --c-on-accent: #ffffff;
        --c-success: #18b77a;
        --c-warning: #e39a27;
        --c-danger: #e05252;
        --c-titlebar: #ffffff;
        --shadow-card: 0 8px 24px -14px rgba(38, 54, 77, 0.22);
        --radius-sm: 7px;
        --radius-md: 9px;
        --radius-lg: 11px;
        --font-sans:
          -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei',
          sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --t-string: #2f7fa6;
        --t-hash: #18b77a;
        --t-list: #e39a27;
        --t-set: #8b5cf6;
        --t-zset: #e05252;
        --t-stream: #0ea5e9;
      }
      .dark {
        --c-surface: #0b0e14;
        --c-surface-alt: #0e121b;
        --c-surface-raised: #161b28;
        --c-surface-inset: #0a0d14;
        --c-edge: #1e2534;
        --c-edge-hi: #2a3549;
        --c-fg: #e6eaf2;
        --c-fg-secondary: #8b94a7;
        --c-fg-muted: #5f6879;
        --c-accent: #4fc3f7;
        --c-accent-dim: rgba(79, 195, 247, 0.12);
        --c-on-accent: #04121b;
        --c-success: #5fd08a;
        --c-warning: #fbbf24;
        --c-danger: #ff7b72;
        --c-titlebar: #0a0d14;
        --shadow-card: 0 8px 24px -14px rgba(0, 0, 0, 0.6);
        --t-string: #4fc3f7;
        --t-hash: #5fd08a;
        --t-list: #fbbf24;
        --t-set: #a78bfa;
        --t-zset: #ff7b72;
        --t-stream: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--c-surface-alt);
        color: var(--c-fg);
        font: 13px/1.5 var(--font-sans);
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        cursor: pointer;
      }
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      svg {
        width: 1em;
        height: 1em;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .mono {
        font-family: var(--font-mono);
      }
      .spacer {
        flex: 1;
      }
      sup.ref {
        color: var(--c-accent);
        font-size: 9.5px;
        font-weight: 600;
        margin-left: 3px;
        white-space: nowrap;
      }

      /* ── prototype chrome ───────────────────────────────────────── */
      .proto {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 14px;
        height: 46px;
        flex: none;
        background: var(--c-surface);
        border-bottom: 1px solid var(--c-edge);
      }
      .proto h1 {
        font-size: 13px;
        margin: 0;
        white-space: nowrap;
      }
      .proto h1 small {
        color: var(--c-fg-muted);
        font-weight: 400;
      }
      .screens {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      .screens button {
        padding: 5px 11px;
        border-radius: var(--radius-sm);
        color: var(--c-fg-secondary);
        font-size: 12px;
        white-space: nowrap;
      }
      .screens button[aria-selected='true'] {
        background: var(--c-accent-dim);
        color: var(--c-accent);
        font-weight: 600;
      }
      .ghost {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: var(--radius-sm);
        color: var(--c-fg-secondary);
        font-size: 12px;
      }
      .ghost:hover {
        background: var(--c-accent-dim);
        color: var(--c-accent);
      }
      .stage {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      section.screen {
        display: none;
        flex: 1;
        min-height: 0;
      }
      section.screen.on {
        display: flex;
      }
      .demo {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 7px 14px;
        flex: none;
        background: var(--c-surface-raised);
        border-bottom: 1px dashed var(--c-edge-hi);
        font-size: 11.5px;
      }
      .demo .lbl {
        color: var(--c-fg-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: 10px;
      }
      .pill {
        padding: 3px 9px;
        border: 1px solid var(--c-edge);
        border-radius: 999px;
        color: var(--c-fg-secondary);
        font-size: 11.5px;
      }
      .pill[aria-pressed='true'] {
        border-color: var(--c-accent);
        color: var(--c-accent);
        background: var(--c-accent-dim);
      }

      /* ── app frame ──────────────────────────────────────────────── */
      .frame {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--c-surface);
      }
      .titlebar {
        height: 34px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        background: var(--c-titlebar);
        border-bottom: 1px solid var(--c-edge);
      }
      .traffic {
        display: flex;
        gap: 7px;
      }
      .traffic i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: block;
      }
      .crumb {
        font-size: 11.5px;
        color: var(--c-fg-muted);
      }
      .split {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 228px 1fr;
      }
      .nav {
        border-right: 1px solid var(--c-edge);
        background: var(--c-surface-alt);
        overflow: auto;
        padding: 8px 6px;
        min-width: 0;
      }
      .nav .h {
        display: flex;
        padding: 4px 6px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--c-fg-muted);
      }
      .navrow {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 25px;
        padding: 0 6px;
        border-radius: var(--radius-sm);
        color: var(--c-fg-secondary);
        cursor: pointer;
        white-space: nowrap;
      }
      .navrow:hover {
        background: var(--c-surface-raised);
      }
      .navrow.sel {
        background: var(--c-accent-dim);
        color: var(--c-accent);
      }
      .navrow .cnt {
        margin-left: auto;
        font-size: 10.5px;
        color: var(--c-fg-muted);
        font-family: var(--font-mono);
      }
      .ws {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      /* ── KV context bar (fixes P-1) ─────────────────────────────── */
      .kvbar {
        height: 48px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        border-bottom: 1px solid var(--c-edge);
        background: var(--c-surface-alt);
      }
      .dbpick {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 9px;
        border: 1px solid var(--c-edge-hi);
        border-radius: var(--radius-md);
        background: var(--c-surface-inset);
        font-size: 12.5px;
      }
      .metric {
        font-size: 11.5px;
        color: var(--c-fg-secondary);
        white-space: nowrap;
      }
      .metric b {
        color: var(--c-fg);
        font-weight: 600;
      }
      .dist {
        display: flex;
        gap: 4px;
        overflow: hidden;
      }
      .dist span {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-size: 11px;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        background: var(--c-surface-raised);
        color: var(--c-fg-secondary);
        border: 1px solid var(--c-edge);
        white-space: nowrap;
      }
      .dist i {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        display: block;
      }
      .scanmini {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: var(--c-fg-muted);
        white-space: nowrap;
      }
      .bar {
        width: 84px;
        height: 4px;
        border-radius: 2px;
        background: var(--c-edge);
        overflow: hidden;
        display: inline-block;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--c-accent);
        transition: width 0.25s;
      }
      .iconbtn {
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border-radius: var(--radius-sm);
        color: var(--c-fg-secondary);
        font-size: 12px;
      }
      .iconbtn:hover {
        background: var(--c-accent-dim);
        color: var(--c-accent);
      }
      .iconbtn.on {
        background: var(--c-surface-raised);
        color: var(--c-accent);
        border: 1px solid var(--c-edge);
      }
      .iconbtn.danger:hover {
        background: rgba(224, 82, 82, 0.14);
        color: var(--c-danger);
      }
      .smode {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: var(--radius-sm);
        border: 1px solid rgba(95, 208, 138, 0.4);
        color: var(--c-success);
        white-space: nowrap;
      }

      /* ── strips ─────────────────────────────────────────────────── */
      .tabstrip {
        height: 32px;
        flex: none;
        display: flex;
        align-items: stretch;
        gap: 2px;
        padding: 0 8px;
        border-bottom: 1px solid var(--c-edge);
        overflow-x: auto;
      }
      .tabstrip .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 11px;
        font-size: 12px;
        color: var(--c-fg-muted);
        border-bottom: 2px solid transparent;
        white-space: nowrap;
      }
      .tabstrip .tab.on {
        color: var(--c-accent);
        border-bottom-color: var(--c-accent);
      }
      .content {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .statusbar {
        height: 25px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border-top: 1px solid var(--c-edge);
        background: var(--c-surface-alt);
        font-size: 11px;
        color: var(--c-fg-muted);
        white-space: nowrap;
        overflow: hidden;
      }
      .statusbar b {
        color: var(--c-fg-secondary);
        font-weight: 500;
      }
      .statusbar .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--c-success);
      }

      /* ── 屏 A overview ──────────────────────────────────────────── */
      .home {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px 16px 20px;
      }
      .banner {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: 0 14px;
        border: 1px solid var(--c-edge);
        border-radius: var(--radius-lg);
        background:
          linear-gradient(90deg, var(--c-accent-dim), transparent 55%), var(--c-surface-alt);
        margin-bottom: 12px;
      }
      .logo {
        width: 26px;
        height: 26px;
        border-radius: var(--radius-sm);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        background: #d82c20;
        flex: none;
      }
      .banner .nm {
        font-size: 15px;
        font-weight: 600;
      }
      .banner .ok {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--c-success);
      }
      .banner .pills {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .banner .pills button {
        font-size: 11.5px;
        padding: 4px 9px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--c-edge-hi);
        color: var(--c-fg-secondary);
      }
      .banner .pills button:hover {
        border-color: var(--c-accent);
        color: var(--c-accent);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      @media (max-width: 1080px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        border: 1px solid var(--c-edge);
        border-radius: var(--radius-lg);
        background: var(--c-surface-alt);
        overflow: hidden;
      }
      .card > header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--c-edge);
        font-size: 11px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--c-fg-muted);
      }
      .card > header .src {
        margin-left: auto;
        text-transform: none;
        letter-spacing: 0;
        font-size: 10.5px;
        font-family: var(--font-mono);
        opacity: 0.75;
      }
      .card .bd {
        padding: 10px 12px 12px;
      }
      .kvlist {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 18px;
      }
      .kvlist > div {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 12px;
        padding: 3px 0;
      }
      .kvlist span {
        color: var(--c-fg-muted);
      }
      .kvlist b {
        margin-left: auto;
        font-weight: 600;
        font-family: var(--font-mono);
        font-size: 11.5px;
      }
      .kvlist b.warn {
        color: var(--c-warning);
      }
      .kvlist b.bad {
        color: var(--c-danger);
      }
      .memrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .memrow .bar {
        flex: 1;
        height: 8px;
        border-radius: 4px;
      }
      table.t {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      table.t th {
        text-align: left;
        font-weight: 500;
        color: var(--c-fg-muted);
        font-size: 10.5px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 4px 8px;
        border-bottom: 1px solid var(--c-edge);
      }
      table.t td {
        padding: 5px 8px;
        border-bottom: 1px solid var(--c-edge);
        color: var(--c-fg-secondary);
      }
      table.t tr:last-child td {
        border-bottom: none;
      }
      tbody.click tr:hover td {
        background: var(--c-surface-raised);
        cursor: pointer;
      }
      .num {
        text-align: right;
        font-family: var(--font-mono);
      }
      .dbgrid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }
      .dbcell {
        border: 1px solid var(--c-edge);
        border-radius: var(--radius-md);
        padding: 7px 9px;
        background: var(--c-surface-inset);
        cursor: pointer;
      }
      .dbcell:hover {
        border-color: var(--c-accent);
      }
      .dbcell.empty {
        opacity: 0.4;
      }
      .dbcell .n {
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
      }
      .dbcell .n b {
        font-family: var(--font-mono);
      }
      .dbcell .bar {
        margin-top: 5px;
        height: 3px;
        width: 100%;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .actions button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border: 1px solid var(--c-edge-hi);
        border-radius: var(--radius-md);
        background: var(--c-surface-alt);
        font-size: 12px;
        color: var(--c-fg-secondary);
      }
      .actions button:hover {
        border-color: var(--c-accent);
        color: var(--c-accent);
      }
      .actions button.primary {
        background: var(--c-accent);
        border-color: var(--c-accent);
        color: var(--c-on-accent);
        font-weight: 600;
      }
      .hist {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hist > button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--c-fg-secondary);
        text-align: left;
      }
      .hist > button:hover {
        background: var(--c-surface-raised);
      }
      .hist code {
        font-family: var(--font-mono);
        font-size: 11.5px;
        color: var(--c-fg);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hist time,
      .hist .n {
        margin-left: auto;
        font-size: 11px;
        color: var(--c-fg-muted);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 1.5px 6px;
        border-radius: 5px;
        border: 1px solid currentColor;
        white-space: nowrap;
      }
      .empty {
        font-size: 12px;
        color: var(--c-fg-muted);
        padding: 8px 2px;
      }
      .sec {
        font-size: 10.5px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--c-fg-muted);
        margin: 0 0 6px;
      }
      /* ── 屏 B workbench ─────────────────────────────────────────── */
      .wb {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: 36% minmax(0, 1fr);
      }
      .col-l {
        display: flex;
        flex-direction: column;
        min-width: 0;
        border-right: 1px solid var(--c-edge);
      }
      .hdrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        height: 34px;
        flex: none;
        border-bottom: 1px solid var(--c-edge);
      }
      .hdrow.r1 {
        background: var(--c-surface);
      }
      .hdrow.r2 {
        height: 38px;
      }
      .hdrow.r3 {
        height: 29px;
        font-size: 11.5px;
        color: var(--c-fg-muted);
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--c-edge-hi);
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .seg button {
        padding: 3px 9px;
        font-size: 11.5px;
        color: var(--c-fg-muted);
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .seg button[aria-pressed='true'] {
        background: var(--c-accent-dim);
        color: var(--c-accent);
        font-weight: 600;
      }
      .cnt {
        font-size: 11.5px;
        color: var(--c-fg-muted);
        white-space: nowrap;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1;
        min-width: 0;
        height: 25px;
        padding: 0 8px;
        border: 1px solid var(--c-edge-hi);
        border-radius: var(--radius-sm);
        background: var(--c-surface-inset);
      }
      .search input {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        background: none;
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        padding: 2.5px 7px;
        border-radius: 999px;
        border: 1px solid var(--c-edge);
        color: var(--c-fg-muted);
        white-space: nowrap;
      }
      .chip[aria-pressed='true'] {
        border-color: var(--c-accent);
        color: var(--c-accent);
        background: var(--c-accent-dim);
      }
      .dd {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 6px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--c-edge);
        color: var(--c-fg-secondary);
        font-size: 11px;
      }
      .tree {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: var(--c-surface);
      }
      .trow {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;

          <span class="cnt">${cnt}<sup class="ref">R1 / I-3</sup></span><span class="spacer"></span>
          <button class="iconbtn" id="sa" title="全选已加载 ⌘A">${ic('check')}</button>
          <button class="iconbtn" id="sc" title="取消选择">${ic('x')}</button>
          <button class="iconbtn" id="bt" title="批量 TTL">${ic('clock')}</button>
          <button class="iconbtn danger" id="bd" title="批量删除">${ic('trash')}${S.sel.size ? `<b class="mono" style="font-size:9.5px">${S.sel.size}</b>` : ''}</button>
          <button class="iconbtn" id="tr" title="刷新 ⌘R">${ic('refresh')}</button>
          <button class="iconbtn" id="tn" title="新建键">${ic('plus')}</button>
        </div>
        <div class="hdrow r2"><label class="search">${ic('search')}<input id="pat" placeholder="app:cache:* — 无 glob 字符时短路为 EXISTS+TYPE+TTL" value="${S.pattern}"><button class="iconbtn" id="pdd" style="width:20px;height:20px">${ic('chevd')}</button></label></div>
        <div class="hdrow" style="height:29px;gap:5px;border-bottom:1px solid var(--c-edge)">
          <button class="chip" data-chip="fuzzy" aria-pressed="true">* 模糊</button>
          <button class="chip" data-chip="noexp" aria-pressed="${S.noexp}">${ic('clock')} 仅无过期</button>
          <button class="chip" data-chip="type" aria-pressed="${!!S.typeFilter}">类型 ${S.typeFilter ? '· ' + S.typeFilter : '▾'}</button>
          <span class="cnt" style="margin-left:auto">dbx 无类型/无过期过滤<sup class="ref">§5</sup></span>
        </div>
        <div class="hdrow r3">
          <div class="seg"><button>${ic('tree')} 树</button><button>${ic('list')} 列表</button></div>
          <span class="dd">分隔符 <b class="mono">:</b> ▾</span>
          <button class="chip" data-chip="rules" aria-pressed="${S.rules}">规则分组</button>
          <span class="cnt" style="margin-left:auto">sticky 头 ${S.sticky ? 'on' : 'off'}<sup class="ref">R3</sup></span>
        </div>
        <div class="tree" id="tree"></div>
        ${S.sel.size ? `<div class="batch"><b>已选 ${S.sel.size}</b><button class="btn" id="q1">批量 TTL</button><button class="btn" id="q2">批量删除</button><span style="color:var(--c-fg-secondary)">成功 12 / 失败 3 · 失败键保持选中<sup class="ref">I-8</sup></span></div>` : ''}
        <div class="treefoot" id="foot"></div>`;
        $$('[data-mode]', host).forEach(
          (b) =>
            (b.onclick = () => {
              S.mode = b.dataset.mode;
              render();
              toast(
                S.mode === 'value'
                  ? '值搜索：scan_values 服务端游标 + 进度/取消（dbx 无此能力）'
                  : '键名搜索',
              );
            }),
        );
        $$('[data-chip]', host).forEach(
          (b) =>
            (b.onclick = () => {
              const k = b.dataset.chip;
              if (k === 'type')
                return menu(b, [
                  { lbl: '类型过滤（服务端 pipeline TYPE 聚合）' },
                  ...Object.keys(TC).map((t) => ({
                    label: t,
                    onClick: () => {
                      S.typeFilter = S.typeFilter === t ? null : t;
                      render();
                    },
                  })),
                  { sep: true },
                  {
                    label: '清除',
                    onClick: () => {
                      S.typeFilter = null;
                      render();
                    },
                  },
                ]);
              if (k === 'fuzzy') return toast('模糊：pattern 自动包裹 *…');
              if (k === 'rules')
                return menu(b, [
                  { lbl: '规则分组 · glob ≤64 条（纯前端）' },
                  { label: 'includes app:* → 「应用」' },
                  { label: 'excludes *:tmp' },
                  { label: '+ 新增规则', icon: 'plus' },
                ]);
              S[k] = !S[k];
              render();
            }),
        );
        host
          .querySelectorAll('.seg button')
          .forEach(
            (b) =>
              (b.onclick = () =>
                toast(
                  /树/.test(b.textContent)
                    ? '树：list_children 服务端层级取数（比 dbx 客户端 split 省流量）'
                    : '列表：scan_keys 平铺 + 客户端分组',
                )),
          );
        $('#pdd', host).onclick = (e) =>
          menu(e.currentTarget, [
            { lbl: '本连接本 db 历史 pattern' },
            {
              label: 'app:cache:*',
              onClick: () => {
                S.pattern = 'app:cache:*';
                render();
              },
            },
            {
              label: '*report*',
              onClick: () => {
                S.pattern = '*report*';
                render();
              },
            },
            { sep: true },
            { lbl: '键模板' },
            {
              label: 'users:{id}',
              onClick: () => {
                S.pattern = 'users:*';
                render();
              },
            },
            {
              label: 'sess:{uid}:timeline',
              onClick: () => {
                S.pattern = 'sess:*';
                render();
              },
            },
          ]);
        $('#pat', host).oninput = (e) => {
          S.pattern = e.target.value;
          S.scan =
            S.pattern && !/[*?[\]]/.test(S.pattern)
              ? 'exact'
              : S.scan === 'exact'
                ? 'idle'
                : S.scan;
          render();
        };
        $('#sa', host).onclick = () => {
          FLAT.forEach((r) => S.sel.add(r.k));
          render();
          toast('⌘A 全选已加载 ' + FLAT.length + ' 个键');
        };
        $('#sc', host).onclick = () => {
          S.sel.clear();
          render();
        };
        const bt = () =>
          S.sel.size
            ? toast('批量 TTL：pipeline PEXPIRE，失败键保持选中（I-8）')
            : toast('先在左列选择键');
        const bd = () =>
          S.sel.size
            ? modal(
                '批量删除',
                `将删除 <b>${S.sel.size}</b> 个键（pipeline DEL）。SafeMode 开启时硬阻断。`,
                [
                  { label: '取消' },
                  {
                    label: '确认删除',
                    primary: true,
                    onClick: () => {
                      toast('SafeMode 开 → 硬阻断（I-6）');
                      S.sel.clear();
                      render();
                    },
                  },
                ],
              )
            : toast('先在左列选择键');
        $('#bt', host).onclick = bt;
        $('#bd', host).onclick = bd;
        $('#tr', host).onclick = () =>
          guard('刷新键树', () => toast('刷新：保留每分组游标与已加载子集（I-4）'));
        $('#tn', host).onclick = () => toast('新建键对话框');
        $('#q1', host) && ($('#q1', host).onclick = bt);
        $('#q2', host) && ($('#q2', host).onclick = bd);
        renderTree();
        renderFoot();
      }

      function rowOf(k, depth) {
        const d = KEYS[k],
          isSel = S.selected === k,
          checked = S.sel.has(k);
        const n = el('div', 'trow leaf' + (isSel ? ' sel' : ''));
        n.style.paddingLeft = 8 + (4 + depth * 10) + 'px';
        n.innerHTML = `${ic('key')}<span class="lbl">${k}</span>${badge(d.type)}${d.ttl < 0 ? '' : `<span class="ttl${d.ttl < 120 ? ' p' : ''}">${ft(d.ttl)}</span>`}<input type="checkbox" class="cb" ${checked ? 'checked' : ''}><span class="del">${ic('trash')}</span>`;
        n.onclick = (e) => {
          if (e.target.classList.contains('cb')) {
            S.sel.has(k) ? S.sel.delete(k) : S.sel.add(k);
            render();
            return;
          }
          if (e.target.classList.contains('del')) {
            bdConfirm(k);
            return;
          }
          guard(`打开 ${k}`, () => {
            S.selected = k;
            S.big = !!d.big;
            S.hex = false;
            S.dirty = false;
            S.rtab = 'detail';
            render();
          });
        };
        return n;
      }
      function bdConfirm(k) {
        modal('删除键', `将删除 <b class="mono">${k}</b>。子树/集合类元素一并删除，不可撤销。`, [
          { label: '取消' },
          { label: '删除', primary: true, onClick: () => toast('SafeMode 开 → 硬阻断（I-6）') },
        ]);
      }

      function renderTree() {
        const host = $('#tree');
        if (!host) return;
        host.innerHTML = '';
        const groups = [
          ['app', ['app:cache:session:1', 'app:cache:session:2'], 'app:report:2026-09:blob'],
          ['users', ['users:1001', 'users:1002'], null],
          ['misc', [], null],
        ];
        const folder = (label, id, depth, n) => {
          const open = OPEN.has(id);
          const row = el('div', 'trow folder' + (open ? '' : ' closed'));
          row.style.paddingLeft = 8 + (4 + depth * 10) + 'px';
          row.innerHTML = `${ic('chevd', 'chev')}${ic('folder')}<span class="lbl" style="color:var(--c-warning)">${label}</span><span class="n">(${n})</span>`;
          row.onclick = () => {
            OPEN.has(id) ? OPEN.delete(id) : OPEN.add(id);
            renderTree();
            toast(`分组游标已记忆（I-4）：折叠不清空 ${id}`);
          };
          return row;
        };
        if (S.sticky)
          host.append(
            el(
              'div',
              'sticky',
              `<span>app</span><span class="n">(8+)</span><span class="spacer"></span><span>游标 7421 · 记忆</span>`,
            ),
          );
        host.append(folder('cache', 'app:cache', 0, '8+'));
        if (OPEN.has('app:cache'))
          ['app:cache:session:1', 'app:cache:session:2'].forEach((k) => host.append(rowOf(k, 1)));
        host.append(rowOf('app:report:2026-09:blob', 0));
        if (S.sticky)
          host.append(
            el(
              'div',
              'sticky',
              `<span>users</span><span class="n">(1.2k+)</span><span class="spacer"></span><span>游标 0 · 未完成</span>`,
            ),
          );
        host.append(folder('users', 'users', 0, '1.2k+'));
        if (OPEN.has('users'))
          ['users:1001', 'users:1002'].forEach((k) => host.append(rowOf(k, 1)));
        if (S.sticky)
          host.append(el('div', 'sticky', '<span>其他</span><span class="n">(5)</span>'));
        [
          'queue:email:dead',
          'feature:flags',
          'metrics:hourly:20260920',
          'events:order-created',
        ].forEach((k) => host.append(rowOf(k, 0)));
      }

      function renderFoot() {
        const host = $('#foot');
        if (!host) return;
        const map = {
          idle: `<span class="cnt">全部已加载 · 游标 0</span><span class="spacer"></span><button class="btn">Load more</button><button class="btn">Fetch all</button>`,
          loading: `<span class="cnt">已加载 ${S.loaded} / 52+</span><span class="bar"><i style="width:35%"></i></span><span class="spacer"></span><button class="btn">Load more</button><button class="btn">Fetch all</button>`,
          scanning: `<span class="cnt">扫描中 12k / ${(BUDGET / 1000).toFixed(0)}k</span><span class="bar"><i style="width:24%"></i></span><span class="spacer"></span><button class="btn stop">${ic('stop')} Stop fetching</button>`,
          budget: `<span class="cnt" style="color:var(--c-warning)">预算耗尽 ${(BUDGET / 1000).toFixed(0)}k / ${(BUDGET / 1000).toFixed(0)}k · 结果可能不完整<sup class="ref">I-2</sup></span><span class="spacer"></span><button class="btn">提高预算 ▾</button><button class="btn">Fetch all</button>`,
          fetchall: `<span class="cnt">Fetch all · 25k 分片 + rAF · 保持视口锚点</span><span class="bar"><i style="width:61%"></i></span><span class="spacer"></span><button class="btn stop">Stop fetching</button>`,
          exact: `<span class="cnt">无 glob → EXISTS+TYPE+TTL 短路，不走 SCAN<sup class="ref">I-3</sup></span><span class="spacer"></span><button class="btn">1 / 1</button>`,
        };
        host.innerHTML = map[S.scan] || map.idle;
        host.querySelectorAll('button.btn').forEach(
          (b) =>
            (b.onclick = () => {
              const t = b.textContent;
              if (/Stop/.test(t)) {
                S.scan = 'loading';
                render();
                return toast('scan_abort：已停，游标保留（I-4）');
              }
              if (/Load more/.test(t)) {
                S.scan = 'loading';
                render();
                setTimeout(() => {
                  S.scan = 'idle';
                  S.loaded = Math.min(52, S.loaded + 40);
                  render();
                }, 500);
                return toast('下一批：list_children + pipeline TYPE/TTL');
              }
              if (/Fetch all/.test(t)) {
                S.scan = 'fetchall';
                render();
                return toast('25k 分片 + rAF 让出主线程');
              }
              if (/预算/.test(t)) {
                BUDGET = 200000;
                S.scan = 'scanning';
                render();
                return toast('预算 → 200k，续用当前游标');
              }
            }),
        );
      }

      /* ── 右列：键详情（§3.3，去掉 查看/编辑 切换） ───────────────── */
      function renderRight() {
        const host = $('#col-r');
        host.innerHTML = `<div class="rtabs">${RTABS.map(([id, label]) => `<button class="tab${S.rtab === id ? ' on' : ''}" data-rtab="${id}">${label}</button>`).join('')}</div><div class="detail" id="detail"></div>`;
        host.querySelectorAll('[data-rtab]').forEach(
          (b) =>
            (b.onclick = () =>
              guard(`切换到「${b.textContent}」`, () => {
                S.rtab = b.dataset.rtab;
                render();
              })),
        );
        const d = $('#detail');
        if (S.rtab !== 'detail') return renderOther(d);
        const k = S.selected,
          o = KEYS[k];
        if (!o) {
          d.innerHTML = k
            ? `<div class="empty" style="padding:22px">已选中 <b class="mono">${k}</b>（原型未内置该键的 mock 值；实际由 <span class="mono">get_key</span> 取数后渲染同一套键详情）。</div>`
            : `<div class="empty" style="padding:22px">左列选择一个键开始。空态（I-11）：「当前 db 无匹配键」。</div>`;
          return;
        }
        const big = S.big || o.big;
        const ro = S.hex || big;
        d.innerHTML = `
        <div class="dhead">
          <span class="key" title="${k}">${k}</span>
          <div class="split-btn"><button id="rf">${ic('refresh')}<span class="cnt">刷新</span></button><button id="ar" title="自动刷新间隔">${ic('chevd')}</button></div>
          <button class="iconbtn" id="ck" title="复制键名">${ic('copy')}</button>
          <button class="iconbtn" id="cs" title="复制插入语句">${ic('braces')}</button>
          <button class="iconbtn" id="rn" title="重命名">${ic('pencil')}</button>
          <button class="iconbtn danger" id="dk" title="删除">${ic('trash')}</button>
          <span class="spacer"></span>
          <button class="iconbtn${S.props ? ' on' : ''}" id="pp2" title="键属性侧栏">${ic('panel')}</button>
        </div>
        <div class="badgerow">
          ${badge(o.type)}<span>大小: ${fb(o.bytes)}</span><span class="mono" style="opacity:.7">enc ${o.enc}</span>
          <button class="ttl-pill ${o.ttl < 0 ? '' : 'pe'}" id="ttl">${ic('clock')}${o.ttl < 0 ? '永不过期' : '剩余 ' + ft(o.ttl)}</button><sup class="ref">§3.3</sup>
          ${o.ttl > 0 && o.ttl < 120 ? '<span class="cnt" style="color:var(--c-warning)">即将过期</span>' : ''}
          <span class="spacer"></span><span class="cnt">db ${S.db} · ${o.type === 'string' ? '1 值' : '见下方'}</span>
        </div>
        ${S.ttlEdit ? ttlEditor(o) : ''}
        <div class="coderow"><span>编解码</span>${CODECS.map((c) => `<button class="v" data-codec="${c}" aria-pressed="${S.codec === c}">${c}</button>`).join('')}<sup class="ref">§3.3</sup></div>
        <div class="coderow"><span>视图</span>${VIEWS.map((v) => `<button class="v" data-view="${v}" aria-pressed="${S.view === v}">${v}</button>`).join('')}
          <button class="chip" id="wr" aria-pressed="${S.wrap}" style="margin-left:auto">自动换行</button></div>
        <div class="valuewrap">
          ${big ? `<div class="notice">${ic('warn')}<span>大 value：哨兵 <span class="mono">GETRANGE 0 65537</span> 判定已截断（实际 ${fb(o.bytes)}），编辑器只读。<span class="mono">Codec</span> 行仍可用于按分片预览。</span><button class="act" id="lz">按需加载分片</button></div>` : ''}
          ${S.hex ? `<div class="notice">${ic('warn')}<span>只读（I-5）：Hex/Binary 视图不可原样回写，避免破坏字节序列。</span><button class="act" id="uh">切回 UTF-8</button></div>` : ''}
          ${S.codec !== 'none' && !big && !S.hex ? `<div class="notice info">${ic('check')}<span>已按 <b>${S.codec}</b> 解码显示；保存时会自动重新编码回写原格式。</span></div>` : ''}
          ${o.type === 'string' ? stringEditor(o, ro) : collectionEditor(o)}
        </div>
        <div class="dfoot">
          ${S.dirty ? `<span class="dirty-flag">${ic('warn')} 有未保存更改</span><button class="btn" id="discard">放弃</button><button class="btn p" id="save">保存</button><span class="cnt">SET … KEEPTTL（服务端拒绝时回退 PTTL+PX）<sup class="ref">§3.3</sup></span>` : `<span class="cnt">无更改 · 编辑器常驻可写（查看/编辑 切换按钮已删除）<sup class="ref">§3.3</sup></span>`}
          <span class="spacer"></span><span class="cnt">⌘S 保存 · Esc 放弃</span>
        </div>`;
        bindDetail(o, k);
      }

      function ttlEditor(o) {
        const seg = ['none', 'rel', 'at']
          .map(
            (m) =>
              `<button class="v" data-ttlmode="${m}" aria-pressed="${S.ttlMode === m}" style="padding:2.5px 8px;border:1px solid var(--c-edge);border-radius:var(--radius-sm);font-size:11px;${S.ttlMode === m ? 'border-color:var(--c-accent);background:var(--c-accent-dim);color:var(--c-accent)' : ''}">${m === 'none' ? '永不过期' : m === 'rel' ? '相对 TTL' : '绝对时间'}</button>`,
          )
          .join('');
        return `<div class="ttle"><span class="cnt">过期策略<sup class="ref">§3.3</sup></span>${seg}
          ${S.ttlMode === 'none' ? '<span class="cnt">→ PERSIST</span>' : S.ttlMode === 'rel' ? '<input value="3600" placeholder="秒"><span class="cnt">秒 → PEXPIRE</span>' : '<input value="2026-09-22 00:00" class="mono" style="width:150px"><span class="cnt">→ EXPIREAT</span>'}
          <button class="btn p" id="ttl-apply">应用</button><button class="btn" id="ttl-cancel">取消</button></div>`;
      }
      function stringEditor(o, ro) {
        return `<textarea class="val" id="v" ${ro ? 'readonly' : ''} wrap="${S.wrap ? 'soft' : 'off'}" spellcheck="false">${o.value}</textarea>`;
      }
      function collectionEditor(o) {
        const head = `<div style="display:flex;align-items:center;gap:8px;padding:6px 0"><span class="cnt">${o.total ? `已加载 ${o.rows.length} / ${o.total.toLocaleString()} · Load more` : `共 ${(o.fields || o.members || []).length} 项`}</span><label class="search" style="max-width:230px">${ic('search')}<input placeholder="服务端成员/字段搜索（非过滤已加载行）"></label><button class="btn">+ 新增</button><span class="spacer"></span><span class="cnt">列可排序 · hash field TTL<sup class="ref">§6 P2</sup></span></div>`;
        if (o.type === 'hash')
          return (
            head +
            `<div class="keytable"><table class="t"><thead><tr><th>field</th><th>value</th><th style="width:90px">field TTL</th><th style="width:44px"></th></tr></thead><tbody>${o.fields.map(([f, v, t]) => `<tr><td class="mono">${f}</td><td class="mono edit">${v}</td><td class="mono num">${t < 0 ? '—' : ft(t)}</td><td>${ic('trash')}</td></tr>`).join('')}</tbody></table></div>`
          );
        if (o.type === 'list')
          return (
            head +
            `<div class="keytable"><table class="t"><thead><tr><th style="width:56px">index</th><th>value</th><th style="width:44px"></th></tr></thead><tbody>${o.rows.map(([i, v]) => `<tr><td class="mono">${i}</td><td class="mono edit">${v}</td><td>${ic('trash')}</td></tr>`).join('')}</tbody></table></div>`
          );
        if (o.type === 'set')
          return (
            head +
            `<div class="keytable"><table class="t"><tbody>${o.members.map((m) => `<tr><td class="mono edit">${m}</td><td style="width:44px">${ic('trash')}</td></tr>`).join('')}</tbody></table></div>`
          );
        if (o.type === 'zset')
          return (
            head +
            `<div class="keytable"><table class="t"><thead><tr><th style="width:96px">score</th><th>member</th><th style="width:44px"></th></tr></thead><tbody>${o.rows.map(([m, s], i) => `<tr><td class="mono num edit" data-score="${i}">${s}</td><td class="mono">${m}</td><td>${ic('trash')}</td></tr>`).join('')}</tbody></table></div><p class="empty">zset 内联行编辑：点 score 单元格 → 输入 → Enter 保存 / Esc 取消<sup class="ref">§3.3</sup></p>`
          );
        return streamEditor(o);
      }
      function streamEditor(o) {
        return `<div class="coderow" style="border-bottom:1px solid var(--c-edge)"><button class="v" data-sub="entries" aria-pressed="${S.streamSub === 'entries'}">Entries</button><button class="v" data-sub="groups" aria-pressed="${S.streamSub === 'groups'}">Groups</button><span class="cnt" style="margin-left:auto">length 12.4k · last-id 1727049002-0</span></div>
        ${

      function render() {
        if (S.screen === 'diag') return renderDiag();
        if (S.screen === 'home') return renderHome();
        if (S.screen === 'scan') return renderScan();
        $('#crumb-db').textContent = S.db;

        renderNav($('#nav-b'));
        renderTabstrip();
        renderLeft();
        renderRight();
        renderProps();
        renderStatus($('#status-b'), 'kv');
        $$('.demo .pill').forEach((b) =>
          b.setAttribute('aria-pressed', String(!!S[b.dataset.toggle])),
        );
      }
      function go(name) {
        if (name === 'browse' && !S.db) S.db = 'db0';
        S.screen = name;
        document
          .querySelectorAll('.screens [data-screen]')
          .forEach((b) => b.setAttribute('aria-selected', String(b.dataset.screen === name)));
        document
          .querySelectorAll('section.screen')
          .forEach((s) => s.classList.toggle('on', s.dataset.screen === name));
        render();
      }
      document
        .querySelectorAll('.screens [data-screen]')
        .forEach((b) => (b.onclick = () => go(b.dataset.screen)));
      document.querySelectorAll('.demo .pill').forEach(
        (b) =>
          (b.onclick = () => {
            const k = b.dataset.toggle;
            if (k === 'scanning') {
              S.scan = S.scan === 'scanning' ? 'idle' : 'scanning';
              return render();
            }
            if (k === 'dirty') {
              S.dirty = !S.dirty;
              if (S.dirty) S.rtab = 'detail';
              return render();
            }
            S[k] = !S[k];
            if (k === 'big' && S.big) S.rtab = 'detail';
            if (k === 'hex' && S.hex) S.rtab = 'detail';
            render();
          }),
      );
      $('#theme').onclick = () => {
        document.documentElement.classList.toggle('dark');
        toast(
          document.documentElement.classList.contains('dark')
            ? 'dark（默认主题）'
            : 'light（:root）',
        );
      };
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          $('#menu').classList.remove('on');
          if ($('#modal').classList.contains('on')) $('#modal').classList.remove('on');
          else if (S.ttlEdit) {
            S.ttlEdit = false;
            render();
          }
          return;
        }
        const tag = (e.target.tagName || '').toLowerCase();
        if (tag === 'input' || tag === 'textarea') return;
        if ((e.metaKey || e.ctrlKey) && e.key === 'a') {
          e.preventDefault();
          FLAT.forEach((r) => S.sel.add(r.k));
          render();
          toast('⌘A 全选已加载（I-9）');
        }
        if ((e.metaKey || e.ctrlKey) && e.key === 'r') {
          e.preventDefault();
          guard('⌘R 刷新', () => toast('⌘R 刷新：保留分组游标（I-4）'));
        }
        if (e.key === 's' && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
        }
      });
      render();
    </script>
  </body>
</html>
