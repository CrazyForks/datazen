# WinGet manifest template for DataZen Basic (Windows x64).
# Replace PackageVersion, both version segments of InstallerUrl, and
# InstallerSha256 after each release (the SHA256 is also printed in the release
# body by the release-checksums job).
# Submit via winget-pkgs or: winget install Flyxl.DataZen
#
# Installer URL must match the Basic release artifact (no -all / -akulaku variant).
# Naming convention: DataZen-{Version}-{Platform}-{Arch}.{ext}, so the Windows
# installer is DataZen-{Version}-windows-x64.exe — there is no "-nsis" segment;
# canonical_name() in release.yml appends only the file extension. The 0.1.1
# values below predate that convention, so treat the whole URL as a placeholder.

PackageIdentifier: Flyxl.DataZen
PackageVersion: 0.1.1
PackageLocale: en-US
Publisher: Flyxl
PublisherUrl: https://github.com/flyxl
PublisherSupportUrl: https://github.com/flyxl/datazen/issues
PackageName: DataZen
PackageUrl: https://github.com/flyxl/datazen
License: GPL-3.0-or-later
LicenseUrl: https://github.com/flyxl/datazen/blob/main/LICENSE
ShortDescription: Cross-platform desktop database client with AI assistance
Moniker: datazen
Tags:
  - database
  - sql
  - mysql
  - postgresql
  - sqlite
  - redis
Installers:
  - Architecture: x64
    InstallerType: nullsoft
    InstallerUrl: https://github.com/flyxl/datazen/releases/download/v0.1.1/DataZen-0.1.1-windows-x64.exe
    InstallerSha256: 2C2371D9C710829DE9AAF06B81811647DB8ABD46290A7C7A6939ABA02B91AA9C
    Scope: user
    UpgradeBehavior: install
ManifestType: singleton
ManifestVersion: 1.6.0
