name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR / ref 连续 push 时，取消仍在跑的旧运行，只保留最新一次。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATAZEN_KEYRING: file

jobs:
  # ── 前端段：pnpm → codegen → typecheck → 守卫 → 单测 → site 检查 ──
  # 与 rust job 并行：两者互不依赖（Rust 段不消费 typecheck/单测产物，
  # 前端段不消费 cargo 产物），墙钟时间 = max(前端, Rust) 而非两者之和。
  frontend:
    runs-on: ubuntu-latest

    steps:
      # 全量历史：site SEO/i18n 检查要用 base sha / event.before 做 diff。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # builtinLocales.ts is git-ignored codegen. Ensure it exists before
      # typecheck (the prepare hook also generates it, but this makes the
      # dependency explicit and covers CI caches that skip prepare).
      - name: Generate built-in locale codegen
        run: node scripts/generate-builtin-locales.mjs

      - name: TypeScript typecheck
        run: pnpm typecheck

      # 7 个严格守卫合并为一步：任何失败立即停止（fail-fast），
      # 输出清晰标注哪条命令失败。省掉 6 次 shell launch 开销。
      - name: All strict guards (stubs, caps, IDs, layers, ci-docs, version, boundaries)
        run: |
          node scripts/check-managed-stubs.mjs
          node scripts/check-structure-editor-guardrails.mjs
          pnpm test:ids
          pnpm test:layers
          pnpm test:ci-docs
          pnpm test:version
          pnpm test:boundaries

      - name: Guard i18n sync (warning only)
        run: node scripts/i18n-sync-check.mjs
        continue-on-error: true

      - name: Frontend unit tests
        # ── Explicit, acknowledged absence of the Pro package ───────────────
        # `packages/pro-extensions/sql-editor-pro` is a SEPARATE git repository
        # that the host gitignores (`.gitignore:68`). This job checks out the
        # host repo only, so the Pro is structurally absent here — it is not
        # fetched, not built, not tested.
        #
        # THREE host guards consult `DATAZEN_ALLOW_MISSING_PRO`, and they share
        # one verdict implementation (`proVerdict()` in scripts/pro-seam-gate.mjs):
        #   1. scripts/__tests__/pack-ep.test.ts        (Pro packaging checks)
        #   2. src/components/sql-editor/__tests__/proSettingsSeam.test.ts
        #   3. scripts/pro-seam-gate.mjs                 (the seam gate)
        # They are fail-by-default precisely so that an unrunnable seam is a
        # LOUD, named failure rather than a quiet green.
        #
        # ⚠️ A FOURTH Pro-dependent guard exists and does NOT consult this
        # variable: `packages/extension-points/src/__tests__/security.test.ts`.
        # It is NOT part of the opt-out family and must not be described as such.
        #
        # This step is therefore NOT green in this environment. Enumerating every
        # known failure source, measured in this repo under exactly these
        # conditions (Pro absent, DATAZEN_ALLOW_MISSING_PRO=1):
        #
        #   1. packages/extension-points/src/__tests__/security.test.ts
        #      — 4 failures, each `ENOENT ... /sql-editor-pro/manifest.json`,
        #      all inside its `EXTENSION_POINTS_VERSION 1.1.0 contract` block.
        #      It never reads the opt-out, so this env block cannot affect it.
        #      PRE-EXISTING: untouched by this change, and it is the sole reason
        #      the step is red. Run: 4 failed | 4872 passed | 9 skipped (4885).
        #   2. Load-sensitive suites are known flakes and can add unrelated
        #      failures; a reported instance of `sqlSnippetsLifecycleJourney` did
        #      NOT reproduce in the measurement above. Treat any failure not
        #      listed in (1) as NEW until proven otherwise.
        #   3. The new Pro guards themselves: 0 failures, 9 skips (2 in
        #      pack-ep.test.ts, 7 in proSettingsSeam.test.ts). They are green here
        #      only because the absence is acknowledged — `state=ABSENT` means
        #      NOT TESTED, not passed.
        #
        # So: this step being red does not by itself tell you whether (1) or (3)
        # is at fault. For the Pro guards' own verdict, read the dedicated step
        # below — that one is attributable on its own.
        #
        # Setting this variable does NOT mean "the Pro checks passed". It means
        # "this checkout knowingly has no Pro repo" — the guards short-circuit
        # and the Pro-side coverage stays UNTESTED here. The Pro's own suite is
        # not run by any CI job; run it locally with `pnpm test:pro-seam`.
        #
        # ⚠️ REMOVE this env block the moment CI can obtain the Pro checkout
        # (a checkout step / submodule / artifact fetch). With the Pro present
        # these guards must run and must be green — do not leave the opt-out
        # behind, or CI will report coverage it does not have.
        env:
          DATAZEN_ALLOW_MISSING_PRO: '1'
        run: pnpm test:unit

      - name: Pro-dependent host guards (dedicated, independently attributable)
        # Runs ONLY the Pro-dependent guard files, in their own process, so their
        # verdict is separable from every pre-existing red in `test:unit`.
        # Without this step, "the Pro guards went red" and "something else went
        # red" were the same signal (both exit 1), and a real Pro regression would
        # have been indistinguishable from the 4 `security.test.ts` ENOENTs.
        #
        # READ THE SUMMARY LINE, NOT JUST THE EXIT CODE. It ends with:
        #     PRO-GUARDS state=<ABSENT|PARTIAL|PRESENT> verdict=<...> exit=<n>
        # A green step with `state=ABSENT` means the Pro guards were NOT RUN —
        # that is "not tested", NOT "passed".
        #
        # ⚠️ REMOVE the env block below together with the ones above as soon as
        # CI can obtain the Pro checkout. Then `state=PRESENT` and this step
        # becomes a real gate that must go green.
        env:
          DATAZEN_ALLOW_MISSING_PRO: '1'
        run: pnpm test:pro-guards

      - name: Cross-repo seam gate (Pro) — reported, not run
        # Runs `scripts/pro-seam-gate.mjs`, which would execute the Pro
        # typecheck + suite. This job has no Pro checkout, so with the opt-out it
        # prints a loud SKIPPED banner and exits 0.
        #
        # The step exists so CI does NOT stay silent about the gap: an engineer
        # reading the log can see that the Pro seam was untested here, rather
        # than inferring "all green" from an absence of failures. Without this
        # step the coverage hole is invisible by construction — which is the
        # failure mode that let BUG-003 and G1 through.
        #
        # ⚠️ REMOVE the env block below together with the one on the unit-test
        # step as soon as CI can obtain the Pro checkout. Then this step becomes
        # a real gate and must go green.
        env:
          DATAZEN_ALLOW_MISSING_PRO: '1'
        run: pnpm test:pro-seam

      - name: Check site changes
        id: site-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$BASE" HEAD 2>/dev/null | grep -q '^site/'; then
            echo "site_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Site SEO/i18n checks
        if: steps.site-changes.outputs.site_changed == 'true'
        run: node scripts/check-site-seo.mjs

  # ── Rust 段：工具链 → 系统依赖 → rust-cache → 驱动注入 → cargo 测试 ──
  rust:
    runs-on: ubuntu-latest

    steps:
      # 浅克隆即可：basic 预设全是 path 驱动，resolve-drivers 不做 git fetch；
      # 需要全量历史的 site diff 只在 frontend job。
      - uses: actions/checkout@v5

      # resolve-drivers.mjs → resolve-pro.mjs → pack-ep.mjs 顶层 import 了
      # fflate（ESM 静态解析），所以驱动注入同样需要 node_modules。
      # pnpm store 走 setup-node 缓存，这一步开销很小。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps (Tauri / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Cache Rust compilation
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Resolve drivers (basic)
        run: node scripts/resolve-drivers.mjs --drivers=basic

      # driver-api 与四个 path 驱动均不依赖 --features / 注入产物，合并为一次
      # cargo 调用，省掉一次 workspace 加载与锁获取。
      - name: Rust unit tests (driver API + basic path drivers)
        run: cargo test --lib -p datazen-driver-api -p datazen-driver-postgres -p datazen-driver-mysql -p datazen-driver-sqlite -p datazen-driver-redis

      - name: Rust unit tests (datazen)
        run: |
          FEATURES=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.driver-features.json','utf8')).features.join(','))")
          cargo test -p datazen --lib --features "$FEATURES"

      - name: Restore managed files
        if: always()
        run: node scripts/driver-file-stash.mjs restore

      - name: Rust unit tests (datazen-ai-api)
        run: cargo test -p datazen-ai-api --lib

  # ── 聚合 job：两段全绿才算 CI 通过。
  # 分支保护的 required status check 盯 `ci` 一个即可，拆分 job 不影响它。
  ci:
    needs: [frontend, rust]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "frontend + rust jobs passed"
